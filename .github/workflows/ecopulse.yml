name: Daily LinkedIn Draft

on:
  schedule:
    # Runs at 3:30 AM UTC (9:00 AM IST) Monday through Friday for peak professional engagement.
    - cron: "30 3 * * *"
  workflow_dispatch: {}  # lets you click "Run workflow" manually to test

permissions:
  contents: write
  issues: write

concurrency:
  group: ecopulse-daily
  cancel-in-progress: false

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate draft post
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: |
          python script.py > output.txt
          cat output.txt

      - name: Parse output
        id: parse
        run: |
          TITLE=$(grep "ISSUE_TITLE:" output.txt | sed 's/ISSUE_TITLE: //')
          if [ -z "$TITLE" ]; then
            TITLE="FAILED — script produced no output (check Generate draft post step logs)"
          fi
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          awk '/ISSUE_BODY_START/{flag=1;next}/ISSUE_BODY_END/{flag=0}flag' output.txt > body.txt
          if [ ! -s body.txt ]; then
            echo "The script crashed before printing any output. Check the 'Generate draft post' step logs above for the real error (often a missing package in requirements.txt)." > body.txt
          fi

      - name: Create GitHub Issue with the draft
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('body.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "${{ steps.parse.outputs.title }}",
              body: body,
              labels: ["linkedin-draft"]
            });

      - name: Commit updated memory file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content_memory.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update content memory"
          git fetch origin master
          git rebase origin/master || git rebase --abort
          git push
