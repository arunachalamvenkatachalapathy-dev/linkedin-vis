name: EcoPulse Autonomous LinkedIn Poster

on:
  schedule:
    # 8:30 AM IST = 3:00 AM UTC daily
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without publishing (preview only)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: ecopulse-bot
  cancel-in-progress: false

jobs:
  run-ecopulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Run EcoPulse Pipeline
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ECOPULSE_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python engine.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "ecopulse-bot"
          git config user.email "actions@github.com"
          if [ -f state/posted_log.json ]; then
            git add state/posted_log.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update posted_log [skip ci]"
              git pull --rebase --autostash origin master
              git push origin master
            else
              echo "State is clean; no changes to commit."
            fi
          fi
