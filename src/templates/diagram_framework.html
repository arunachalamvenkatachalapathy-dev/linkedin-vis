<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>/* INLINE_STYLES */</style>
</head>
<body>
  <div class="diagram-canvas">
    <div class="diagram-header">
      <div class="diagram-badge">{{ badge or 'FRAMEWORK' }}</div>
      <div class="diagram-attr">@arunachalamvenv</div>
    </div>
    <div class="diagram-headline">{{ headline or 'System Architecture' }}</div>
    <div class="flow-container">
      {% for step in steps %}
      <div class="flow-node">
        <div class="node-number">{{ loop.index }}</div>
        <div class="node-content">
          <div class="node-title">{{ step.title }}</div>
          <div class="node-desc">{{ step.desc }}</div>
        </div>
      </div>
      {% if not loop.last %}
      <div class="flow-connector">
        <div class="connector-line"></div>
        <div class="connector-arrow">▼</div>
      </div>
      {% endif %}
      {% endfor %}
    </div>
    <div class="diagram-footer">
      <div class="footer-rule">{{ takeaway or '' }}</div>
      <div class="footer-date">{{ date_str or '' }}</div>
    </div>
  </div>
</body>
</html>
